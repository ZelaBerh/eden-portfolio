name: Sync to Eden's GitHub

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Zelalem's repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push changes to Eden's repository
        env:
          EDEN_TOKEN: ${{ secrets.EDEN_GITHUB_TOKEN }}

        run: |
          git remote add eden \
            "https://x-access-token:${EDEN_TOKEN}@github.com/Edenabeselom/portfolio-website.git"

          git push eden HEAD:main
